# ============================================================
# Deployment de la API Gym-Reservas
#
# - 2 réplicas para alta disponibilidad
# - ConfigMap gym-api-config → variables no sensibles
# - Secret gym-db-secret → contraseña de la BD
# - readinessProbe y livenessProbe contra /actuator/health
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-api
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
    componente: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gym-api
  template:
    metadata:
      labels:
        app: gym-api
        proyecto: gimnasio-reservas
        componente: api
    spec:
      containers:
        - name: gym-api
          image: neft007/gym-reservas-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: gym-api-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gym-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
