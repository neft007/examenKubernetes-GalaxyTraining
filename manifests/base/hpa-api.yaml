# ============================================================
# HorizontalPodAutoscaler para la API Gym-Reservas
#
# Escala automáticamente entre 2 y 6 réplicas cuando el uso
# promedio de CPU supera el 70%.
# Requiere metrics-server (minikube addons enable metrics-server)
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gym-api-hpa
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
    componente: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gym-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
