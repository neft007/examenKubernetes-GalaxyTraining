# ============================================================
# Service ClusterIP para Redis
#
# Accesible internamente como gym-redis:6379
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: gym-redis
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
    componente: cache
spec:
  type: ClusterIP
  selector:
    app: gym-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
