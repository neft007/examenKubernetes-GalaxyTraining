# ============================================================
# NetworkPolicy para PostgreSQL
#
# Solo los pods con label app=gym-api pueden conectarse a la BD
# en el puerto 5432. Cualquier otro pod queda bloqueado.
#
# Nota: requiere un CNI que soporte NetworkPolicy (Calico, Cilium).
# Minikube por defecto usa kindnet, que puede no aplicarla.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gym-db-network-policy
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
    componente: base-datos
spec:
  podSelector:
    matchLabels:
      app: gym-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gym-api
        - podSelector:
            matchLabels:
              app: gym-worker
        - podSelector:
            matchLabels:
              app: gym-api-rs
      ports:
        - protocol: TCP
          port: 5432
