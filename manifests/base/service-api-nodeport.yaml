# ============================================================
# Service NodePort para la API Gym-Reservas
# (Services: NodePort)
#
# Expone la API en un puerto del rango 30000-32767 en cada nodo.
# En Minikube se accede vía:
#   minikube service gym-api-nodeport -n dev --url
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: gym-api-nodeport
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
    componente: api
spec:
  type: NodePort
  selector:
    app: gym-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
