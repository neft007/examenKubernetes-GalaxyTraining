# ============================================================
# Ingress para Gym-Reservas
#
# Enruta:
#   /           → gym-frontend-service:80
#   /api        → gym-api-nodeport:8080
#   /actuator   → gym-api-nodeport:8080
#
# Requiere el addon ingress de Minikube:
#   minikube addons enable ingress
#
# Acceso desde el host:
#   http://<minikube-ip>/         (frontend)
#   http://<minikube-ip>/api/v1/... (API)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gym-ingress
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: gym.local
      http:
        paths:
          # API REST
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gym-api-nodeport
                port:
                  number: 8080
          # Actuator (health check del frontend)
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: gym-api-nodeport
                port:
                  number: 8080
          # Frontend (catch-all, debe ir al final)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gym-frontend-service
                port:
                  number: 80
