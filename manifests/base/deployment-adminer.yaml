# ============================================================
# Deployment de Adminer para Gym-Reservas
#
# GUI web para administrar PostgreSQL.
# Se expone vía NodePort (30081) para acceso desde el host.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-adminer
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
    componente: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gym-adminer
  template:
    metadata:
      labels:
        app: gym-adminer
        proyecto: gimnasio-reservas
        componente: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: gym-db
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
