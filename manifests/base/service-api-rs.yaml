# ============================================================
# Service NodePort para el ReplicaSet gym-api-rs
#
# Service relacionado al ReplicaSet explícito.
# Acceso: minikube service gym-api-rs -n dev --url
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: gym-api-rs
  namespace: dev
  labels:
    proyecto: gimnasio-reservas
    componente: api
    tipo: replicaset
spec:
  type: NodePort
  selector:
    app: gym-api-rs
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
