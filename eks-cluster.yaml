# ============================================================
# Configuración del clúster EKS para Gym-Reservas
# ============================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: gym-cluster
  region: us-east-2
  version: "1.31"

managedNodeGroups:
  - name: gym-nodes
    instanceType: t3.micro
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
    labels:
      role: worker
      proyecto: gimnasio-reservas
